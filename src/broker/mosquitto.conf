# ============================================================
# Mosquitto Broker Configuration
# Hybrid IoT Security System - BBM460
# ============================================================

# Persistence (store subscriptions / retained messages across restarts)
persistence true
persistence_location ./data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ------------------------------------------------------------
# Listener 1: Standard MQTT (TCP) - used by ESP32-CAM firmware
# ------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# ------------------------------------------------------------
# Listener 2: MQTT over WebSocket - used by browser (MQTT.js)
# ------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# ------------------------------------------------------------
# Security
# Anonymous access is enabled for local lab development only.
# For production, create a password file with `mosquitto_passwd`
# and set `allow_anonymous false` + `password_file <path>`.
# ------------------------------------------------------------
allow_anonymous true

# Max packet size (supports larger JSON payloads if ever needed)
max_packet_size 1048576
